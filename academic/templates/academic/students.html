{% extends 'academic/base.html' %}

{% block content %}
<div class="card card-custom p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="color: #d35400; margin: 0;">Listado de Estudiantes</h2>
    </div>

    <!-- Formulario para agregar -->
    <div class="mb-4 p-3 rounded" style="background-color: #fdebd0;">
        <h5 style="color: #d35400;">Agregar Nuevo Estudiante</h5>
        <form id="add-student-form" class="row g-3 mt-1">
            <div class="col-md-5">
                <input type="text" class="form-control" id="first_name" placeholder="Nombre del estudiante" required>
            </div>
            <div class="col-md-5">
                <input type="text" class="form-control" id="last_name" placeholder="Apellido del estudiante" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn w-100" style="background-color: #d35400; color: white;">Guardar</button>
            </div>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead style="background-color: #f39c12; color: white;">
                <tr>
                    <th class="border-0">ID</th>
                    <th class="border-0">Nombre</th>
                    <th class="border-0">Apellido</th>
                    <th class="border-0 text-end">Acciones</th>
                </tr>
            </thead>
            <tbody id="students-table-body" style="border-top: none;">
                <tr>
                    <td colspan="4" class="text-center text-muted py-4">Cargando estudiantes...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock content %}

{% block scripts %}
<script>
    let editingId = null;

    function loadStudents() {
        fetch('/api/students/')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('students-table-body');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No hay estudiantes registrados.</td></tr>';
                    return;
                }

                data.forEach(student => {
                    const row = `<tr>
                        <td>${student.id}</td>
                        <td>${student.first_name}</td>
                        <td>${student.last_name}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-secondary me-1" onclick="editStudent(${student.id}, '${student.first_name}', '${student.last_name}')">Editar</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${student.id})">Eliminar</button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('students-table-body').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error al cargar.</td></tr>';
            });
    }

    function deleteStudent(id) {
        if(confirm("¿Estás seguro de que deseas eliminar este estudiante?")) {
            fetch(`/api/students/${id}/`, { method: 'DELETE' })
            .then(() => loadStudents())
            .catch(error => console.error('Error:', error));
        }
    }

    function editStudent(id, firstName, lastName) {
        editingId = id;
        document.getElementById('first_name').value = firstName;
        document.getElementById('last_name').value = lastName;
        document.querySelector('#add-student-form button').textContent = "Actualizar";
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadStudents();

        document.getElementById('add-student-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const first_name = document.getElementById('first_name').value;
            const last_name = document.getElementById('last_name').value;

            const url = editingId ? `/api/students/${editingId}/` : '/api/students/';
            const method = editingId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ first_name, last_name })
            })
            .then(response => {
                if(response.ok) {
                    document.getElementById('add-student-form').reset();
                    editingId = null;
                    document.querySelector('#add-student-form button').textContent = "Guardar";
                    loadStudents();
                } else {
                    alert("Hubo un error al guardar.");
                }
            })
            .catch(error => console.error('Error:', error));
        });
    });
</script>
{% endblock scripts %}
