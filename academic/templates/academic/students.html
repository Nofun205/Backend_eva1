{% extends 'academic/base.html' %}

{% block content %}
<div class="card card-custom p-4">
    <h2 class="mb-4" style="color: #d35400;">Listado de Estudiantes</h2>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead style="background-color: #f39c12; color: white;">
                <tr>
                    <th class="border-0">ID</th>
                    <th class="border-0">Nombre</th>
                    <th class="border-0">Apellido</th>
                </tr>
            </thead>
            <tbody id="students-table-body" style="border-top: none;">
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">Cargando estudiantes...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock content %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch('/api/students/')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('students-table-body');
                tbody.innerHTML = ''; // Limpiar tabla
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center">No hay estudiantes registrados.</td></tr>';
                    return;
                }

                data.forEach(student => {
                    const row = `<tr>
                        <td>${student.id}</td>
                        <td>${student.first_name}</td>
                        <td>${student.last_name}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error fetching students:', error);
                document.getElementById('students-table-body').innerHTML = '<tr><td colspan="3" class="text-center text-danger">Error al cargar los estudiantes.</td></tr>';
            });
    });
</script>
{% endblock scripts %}
