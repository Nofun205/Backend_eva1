{% extends 'academic/base.html' %}

{% block content %}
<div class="card card-custom p-4">
    <h2 class="mb-4" style="color: #d35400;">Listado de Cursos</h2>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead style="background-color: #f39c12; color: white;">
                <tr>
                    <th class="border-0">ID</th>
                    <th class="border-0">Nombre del Curso</th>
                    <th class="border-0">Profesor Asignado</th>
                </tr>
            </thead>
            <tbody id="courses-table-body" style="border-top: none;">
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">Cargando cursos...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock content %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch('/api/courses/')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('courses-table-body');
                tbody.innerHTML = ''; // Limpiar tabla
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center">No hay cursos disponibles.</td></tr>';
                    return;
                }

                data.forEach(course => {
                    const row = `<tr>
                        <td>${course.id}</td>
                        <td>${course.name}</td>
                        <td>${course.teacher ? course.teacher.first_name + ' ' + course.teacher.last_name : 'No asignado'}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error fetching courses:', error);
                document.getElementById('courses-table-body').innerHTML = '<tr><td colspan="3" class="text-center text-danger">Error al cargar los cursos.</td></tr>';
            });
    });
</script>
{% endblock scripts %}
